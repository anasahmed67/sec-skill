[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secskill"
version = "0.1.0"
description = "Agent-native security reviewer & static analysis engine for AI and human code"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "SecSkill Maintainers", email = "maintainers@secskill.dev" }
]
keywords = [
    "security",
    "sast",
    "agent-skill",
    "claude-code",
    "cursor",
    "antigravity",
    "owasp",
    "cwe",
    "sarif",
    "vulnerability-scanner",
    "code-review",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.24.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
all = ["openai>=1.0.0", "anthropic>=0.18.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/anasahmed67/sec-skill"
Documentation = "https://github.com/anasahmed67/sec-skill#readme"
Repository = "https://github.com/anasahmed67/sec-skill.git"
Issues = "https://github.com/anasahmed67/sec-skill/issues"
Changelog = "https://github.com/anasahmed67/sec-skill/releases"

[project.scripts]
secskill = "secskill.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E501",
    "E402",
    "W291",
    "W292",
    "W293",
    "UP",
    "I",
    "F401",
    "BLE001",
    "S110",
    "B008",
    "PLW1510",
    "F821",
    "PIE",
    "F541",
    "S112",
    "RUF",
    "F841",
    "SIM",
    "TRY",
    "C414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
