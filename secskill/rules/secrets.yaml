rules:
  - id: "SEC-798-AWS-KEY"
    title: "Hardcoded AWS Access Key ID"
    cwe: "CWE-798"
    owasp: "A02:2021-Cryptographic Failures"
    ssdf: "PW.5.1"
    severity: "CRITICAL"
    languages:
      - generic
      - python
      - javascript
      - java
    patterns:
      - "(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"
    min_entropy: 2.5
    remediation:
      description: "Load credentials securely from AWS Secrets Manager, IAM roles, or environment variables. Revoke compromised keys immediately."
      vulnerable_example: |
        AWS_ACCESS_KEY = "AKIAIOSFODNN7EXAMPLE"
      secure_example: |
        import os
        AWS_ACCESS_KEY = os.environ.get("AWS_ACCESS_KEY_ID")
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://docs.aws.amazon.com/general/latest/gr/aws-access-keys-best-practices.html"
    test_cases:
      vulnerable:
        code: |
          aws_key = "AKIA111111111EXAMPLE"
        expected_finding: true
        expected_cwe: "CWE-798"
      secure:
        code: |
          aws_key = os.getenv("AWS_ACCESS_KEY_ID")
        expected_finding: false

  - id: "SEC-798-GITHUB-PAT"
    title: "Hardcoded GitHub Personal Access Token"
    cwe: "CWE-798"
    owasp: "A02:2021-Cryptographic Failures"
    ssdf: "PW.5.1"
    severity: "CRITICAL"
    languages:
      - generic
      - python
      - javascript
    patterns:
      - "(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,255}"
    min_entropy: 3.0
    remediation:
      description: "Do not embed GitHub tokens in source code. Use GitHub Actions secrets or environment variables."
      vulnerable_example: |
        GITHUB_TOKEN = "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      secure_example: |
        const token = process.env.GITHUB_TOKEN;
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    test_cases:
      vulnerable:
        code: |
          token = "ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        expected_finding: true
        expected_cwe: "CWE-798"
      secure:
        code: |
          token = os.environ["GH_TOKEN"]
        expected_finding: false

  - id: "SEC-798-JWT-SECRET"
    title: "Hardcoded JWT Secret / HMAC Key"
    cwe: "CWE-798"
    owasp: "A02:2021-Cryptographic Failures"
    ssdf: "PW.5.1"
    severity: "HIGH"
    languages:
      - python
      - javascript
    patterns:
      - "(?i)(?:jwt_secret|jwt_key|token_secret)\\s*[:=]\\s*[\"'][a-zA-Z0-9_\\-!@#$%^&*]{8,}[\"']"
    remediation:
      description: "Store cryptographic signing secrets in environment variables or an external key vault."
      vulnerable_example: |
        JWT_SECRET = "super_secret_jwt_signing_key_12345"
      secure_example: |
        JWT_SECRET = os.environ["JWT_SECRET_KEY"]
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    test_cases:
      vulnerable:
        code: |
          JWT_SECRET = "mysecretkeythatisverylong12345"
        expected_finding: true
        expected_cwe: "CWE-798"
      secure:
        code: |
          JWT_SECRET = os.getenv("JWT_SECRET")
        expected_finding: false

  - id: "SEC-321-PRIVATE-KEY"
    title: "Exposed Private Key File / Block"
    cwe: "CWE-321"
    owasp: "A02:2021-Cryptographic Failures"
    ssdf: "PW.5.1"
    severity: "CRITICAL"
    languages:
      - generic
    patterns:
      - "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    remediation:
      description: "Remove private keys from source control immediately. Store on disk with 0600 permissions or in a hardware security module (HSM)."
      vulnerable_example: |
        KEY = "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBg..."
      secure_example: |
        with open("/etc/ssl/private/app.key", "r") as f:
            key_data = f.read()
    references:
      - "https://cwe.mitre.org/data/definitions/321.html"
    test_cases:
      vulnerable:
        code: |
          RSA_KEY = "-----BEGIN RSA PRIVATE KEY-----\n..."
        expected_finding: true
        expected_cwe: "CWE-321"
      secure:
        code: |
          key_path = os.getenv("PRIVATE_KEY_PATH")
        expected_finding: false
