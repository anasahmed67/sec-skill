name: SecSkill Code Quality & Security Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SecSkill
        run: pip install .
      - name: Scan Codebase
        run: secskill scan . --format sarif --output results.sarif
